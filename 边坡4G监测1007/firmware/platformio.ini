; ============================================================================
;  边坡 4G 监测节点 —— PlatformIO 编译 / 烧录 / 监视配置（★ 全量内容，无"沿用原工程"）
;  ---------------------------------------------------------------------------
;  项目：边坡4G监测1007
;    AHT30 + MPU6050 --I2C--> ESP32-S3 --UART1--> YED-M100MG-C2 透传DTU --4G--> 服务器
;  主控：ESP32-S3-DevKitC-1（ESP32-S3-WROOM-1 N8）
;  ---------------------------------------------------------------------------
;  常用命令：
;    编译：pio run
;    烧录：pio run -t upload --upload-port COMx
;    监视：pio device monitor -b 115200
;    备用环境：pio run -e esp32-s3-uart0 -t upload --upload-port COMx
;  ---------------------------------------------------------------------------
;  说明：
;   1) 源码目录是 firmware\src（Arduino 风格 main.ino + 模块化 .h/.cpp）。
;      PlatformIO 会把 .ino 自动转成 .cpp 编译；Arduino IDE 用户可直接打开
;      firmware\src 下的 .ino（需把 User_Setup_ST7789_ESP32S3.h 复制进 TFT_eSPI
;      库的 User_Setup.h）。
;   2) 依赖库只有 TFT_eSPI；AHT30 / MPU6050 仍全部用核心自带 Wire.h 自行驱动。
;   3) ★★★ ESP32-S3 上必须给 TFT_eSPI 传 -DUSE_FSPI_PORT=1，
;      否则 TFT_eSPI 2.5.43 会把 SPI 寄存器基址算成 0，tft.init() 触发
;      Guru Meditation(StoreProhibited)、屏幕"背光亮但全黑"。
;   4) 屏幕的全部编译宏都写在 build_flags 里（不改 TFT_eSPI 库内的 User_Setup.h）。
;   5) 4G DTU 的引脚/周期/超时等宏全部在 src\app_config.h（含编译期引脚冲突检查）。
; ============================================================================

[platformio]
; 源码目录（Arduino 风格：main.ino + attitude.* + display_st7789.* + app_config.h）
src_dir = src

; ★ 默认只编译/烧录这个环境（主环境：Serial 走 USB CDC + 同时输出 UART0）
;    必须写这一行！否则 `pio run` 会把本文件里所有 [env:xxx] 依次编译并烧录。
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
upload_speed  = 921600
monitor_speed = 115200

; ------------------ 串口通路与调试等级 ------------------
; ARDUINO_USB_CDC_ON_BOOT / ARDUINO_USB_MODE 等价于 Arduino IDE 菜单
; 【工具 → USB CDC On Boot → Enabled】：Serial 走原生 USB(CDC)。
; 本工程源码做双通路兼容（同时写 USB CDC 与 UART0），删掉这两行则 Serial 变 UART0。
build_flags =
    ; ---------------- 串口通路与调试等级 ----------------
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1

    ; ---------------- TFT_eSPI：ST7789 240x320 + 引脚（等价于改库里的 User_Setup.h）----------------
    ; ★ 这些宏必须让"库源码"也看得到，所以只能放这里（或改库内 User_Setup.h）
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1                 ; 驱动型号（ILI9341 屏则换成 -DILI9341_DRIVER=1）
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1                     ; 只写不读，MISO 不接
    -DTFT_SCLK=21                     ; 屏 SCL（SPI 时钟）
    -DTFT_MOSI=47                     ; 屏 SDA（SPI 数据）
    -DTFT_CS=41                       ; 屏 CS
    -DTFT_DC=40                       ; 屏 DC
    -DTFT_RST=45                      ; 屏 RES（★ GPIO45 是 strapping 脚）
    -DTFT_BL=42                       ; 屏 BLK（随后由 LEDC PWM 接管调光）
    -DTFT_BACKLIGHT_ON=HIGH           ; 背光高电平点亮（低电平点亮的模组改成 LOW）
    -DLOAD_GLCD=1                     ; 8px  基础字体
    -DLOAD_FONT2=1                    ; 16px 字体（角标/状态）
    -DLOAD_FONT4=1                    ; 26px 字体（温湿度大数字）
    -DSPI_FREQUENCY=40000000          ; 40MHz；花屏/闪屏就降到 27000000
    -DTFT_INVERSION_ON=1              ; ST7789 IPS 常见需要；颜色像底片就删掉这行
    -DUSE_FSPI_PORT=1                 ; ★★★ ESP32-S3 必须！否则 tft.init() 崩、屏全黑

; ------------------ 依赖库 ------------------
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; ============================================================================
;  备用环境：Serial 走 UART0(GPIO43/44)，等价于 Arduino IDE 菜单
;  【工具 → USB CDC On Boot → Disabled】
;  ---------------------------------------------------------------------------
;  什么时候用：
;    - 板子只有 USB 转串口口（CH343/CP2102），且打开原生 USB 口看不到输出
;    - 第三方串口工具反复"已连接/已断开"（USB CDC 口被工具 DTR/RTS 反复复位）
;  用法：pio run -e esp32-s3-uart0 -t upload --upload-port COMx
;        pio device monitor -b 115200
; ============================================================================
[env:esp32-s3-uart0]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
upload_speed  = 921600
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; ---------- 与主环境相同的 TFT_eSPI 配置（少了 USB CDC 宏）----------
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1
    -DTFT_SCLK=21
    -DTFT_MOSI=47
    -DTFT_CS=41
    -DTFT_DC=40
    -DTFT_RST=45
    -DTFT_BL=42
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DTFT_INVERSION_ON=1
    -DUSE_FSPI_PORT=1
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
