<div class="login-win" id="login-win" style="display: none;">
	<div class="login-header">
	</div>
	<div class="info-header">
		<div class="nav-tab">
			<div class="tab clearfix navbtn-list">
				<a href="javascript:void(0);" class="show">学号/工号登录</a>
<!--
				<a href="javascript:void(0);">卡号登录</a>
				<a href="javascript:void(0);" style="margin-left: 1px; width: 149px;">宽带线路选择</a>
-->
			</div>
			<div class="tab clearfix title">
				<a href="javascript:void(0);" class="show">欢迎回来！</a>
			</div>
		</div>
		<!-- qrcode_target  qrcode_phone 点击时相互切换 -->
		<a href="javascript:void(0);" node-type="message_tab" action-type="switchTab" action-data="type=message" class="qrcode_target qrcode_phone"></a>
	</div>
	<div class="tab-group account show">
		<div class="form-item">
			<label for="user">
				<div class="ico ico-user" alt="学号/工号"></div>
			</label>
			<input type="text" name="user" id="user" tabindex=1 autocomplete="off" placeholder="学号/工号"/>
		</div>
		<div class="form-item">
			<label for="pass">
				<div class="ico ico-password" alt="密码"></div>
			</label>
			<input type="password" name="pass" id="pass" tabindex=2 autocomplete="off" placeholder="密码"/>
		</div>
		<div class="form-item isplogin">
			<label for="pool">
				<div class="ico ico-isp" alt="线路"></div>
			</label>
			<select name="pool" id="pool" tabindex=3 autocomplete="off"></select>
		</div>
		<div class="form-item footerbar links_btn">
			<a href="javascript:void(0);" id="selfservice">自助服务</a>
			<a href="tp/default/register.html" id="register" target="_blank">注册帐号</a>
			<div class="checkbox">
			  <input type="checkbox" id="remember" autocomplete="off"/>
			  <label for="remember">记住密码</label>
			</div>
		</div>
		<div class="form-item submit">
			<button class="btn" tabindex=4>登录</button>
		</div>
	</div>
	<div class="tab-group cardacct">
		<div class="form-item" style="position: relative;">
			<label for="card_btnck">
				<div class="ico ico-user" alt="充值卡号"></div>
			</label>
			<input type="text" name="user" id="card_btnck" tabindex=1 autocomplete="off" placeholder="充值卡号"/>
		</div>
		<div class="form-item submit">
			<button class="btn" tabindex=2>登录</button>
		</div>
	</div>
	<div class="tab-group pxyacct">
		<div class="form-item">
			<div class="container isphead">
			  <div class="row">
				<div class="col col-7">帐号</div>
				<div class="col col-5">线路</div>
			  </div>
			  <div class="container isplist"></div>
			</div>
		</div>
		<div class="form-item submit">
			<button class="btn">跳过直接登陆</button>
		</div>
	</div>
	<div class="tab-group logged-in">
		<div class="form-item submit">
			<button class="btn selfservice">自助服务</button>
		</div>
		<div class="form-item submit">
			<button class="btn loggoff">注销下线</button>
		</div>
	</div>
</div>
<div class="login-footer"><div class="msg-zone"></div><div class="ad-info"></div></div>
